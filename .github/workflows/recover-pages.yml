name: Recover stalled Strada Pages deployment

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    if: github.repository == 'stasmega/strada-web'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel the specific stale run and Pages deployments
        shell: bash
        run: |
          set -euo pipefail
          run_id=42090601141
          status=$(gh api "/repos/$GH_REPO/actions/runs/$run_id" --jq .status)
          if [[ "$status" != completed ]]; then
            if ! gh api --silent --method POST "/repos/$GH_REPO/actions/runs/$run_id/cancel"; then
              gh api --silent --method POST "/repos/$GH_REPO/actions/runs/$run_id/force-cancel" || true
            fi
          fi
          for deployment in f8a8b2bb4732a1128079121654da0d81de7fb0a8 8168ec7a2c00fafa14a595623efb3018cc1b7d31; do
            gh api --silent --method POST "/repos/$GH_REPO/pages/deployments/$deployment/cancel" || true
          done
      - name: Use the static-site workflow for the existing Pages site
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "/repos/$GH_REPO/pages" -f build_type=workflow --jq '{build_type,html_url,status}'
          gh workflow run pages.yml --repo "$GH_REPO" --ref main

