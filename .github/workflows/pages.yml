name: Publish Strada website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: strada-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate language pages
        run: node tools/localize.cjs
      - name: Test stop handler and Google verification
        run: node --test tests/*.test.cjs
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html sitemap.xml stradalogo_main_preview.png favicon.ico _site/
          cp -r assets home stop privacy terms delete-account et ru .well-known _site/
          shopt -s nullglob
          for verification in google*.html; do
            cp "$verification" _site/
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      # upload-pages-artifact excludes dot-directories, including Android's .well-known.
      # Keep the standard Pages tar format while retaining the domain association.
      - name: Archive website with Android App Links
        run: |
          test -s _site/.well-known/assetlinks.json
          tar --dereference --hard-dereference --directory _site \
            --exclude=.git --exclude=.github \
            -cvf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" ./.well-known/assetlinks.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5

