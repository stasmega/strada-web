name: Publish Strada website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: strada-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test stop handler and Google verification
        run: node --test tests/*.test.cjs
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets home stop privacy terms delete-account .well-known _site/
          shopt -s nullglob
          for verification in google*.html; do
            cp "$verification" _site/
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5

